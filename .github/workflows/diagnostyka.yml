name: Diagnostyka Bieguna

on:
  workflow_dispatch:  # Uruchamiasz ręcznie z zakładki Actions

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj zależności
        run: pip install requests beautifulsoup4 lxml PySocks

      - name: Uruchom diagnostykę Bieguna
        env:
          SCRAPER_PROXIES: ${{ secrets.SCRAPER_PROXIES }}
        run: |
          cat > diag.py << 'EOF'
          import sys, os, threading
          sys.path.insert(0, '.')
          from bs4 import BeautifulSoup
          import fajerwerki_scraper as scraper

          # --- Setup identyczny jak w cmd_scrape dla Bieguna ---
          class Args:
              proxy = None
              proxy_file = None
          scraper.setup_proxies(Args())
          print(f"Proxy w puli: {len(scraper._proxies)}")

          site = scraper.SITES["biegun"]
          host = "fajerwerkibiegun.pl"
          scraper._proxy_hosts.add(host)
          scraper._min_delay[host] = float(site.get("delay", 1.0))
          scraper._host_sem[host] = threading.Semaphore(int(site.get("max_parallel", 2)))

          url = "https://fajerwerkibiegun.pl/pl/wyrzutnie/2691-the-apocalypse-12-riakeo-abcd-5907317500955.html"
          hdrs = scraper.site_headers("biegun", site)

          print("=" * 60)
          print("Pobieranie przez scraper.get() (przez proxy)")
          print("=" * 60)
          r = scraper.get(url, stats={}, headers=hdrs)
          if r is None:
              print(f"BŁĄD POBIERANIA: {scraper._tls.last_fail}")
              sys.exit(1)
              
          print(f"HTTP {r.status_code}, {len(r.content)} B, URL: {r.url}")

          soup = BeautifulSoup(r.content, "lxml")

          print("\n" + "=" * 60)
          print("Wszystkie tagi itemprop='price' na stronie:")
          print("=" * 60)
          els = soup.find_all(attrs={"itemprop": "price"})
          print(f"Znaleziono: {len(els)}")
          for i, el in enumerate(els):
              print(f"  [{i}] content={el.get('content')!r} text={el.get_text(strip=True)!r} parent=<{el.parent.name}> class={el.get('class', [])}")

          print("\n" + "=" * 60)
          print("Meta tagi cenowe:")
          print("=" * 60)
          for meta_name in ["product:price:amount", "og:price:amount", "product:price:currency", "product:pretax_price:amount"]:
              v = scraper.meta(soup, meta_name)
              print(f"  {meta_name} = {v!r}")

          print("\n" + "=" * 60)
          print("Co zwraca funkcja extract():")
          print("=" * 60)
          d = scraper.extract(r.content, site)
          if d:
              print(f"  name = {d.get('name')!r}")
              print(f"  price = {d.get('price')}")
              print(f"  currency = {d.get('currency')}")
              print(f"  availability = {d.get('availability')}")
          else:
              print("  extract() zwrócił None")

          print("\n" + "=" * 60)
          print("Czy w HTML występuje 3104.88 / 3819?")
          print("=" * 60)
          text = r.text
          print(f"  '3104.88'  = {text.count('3104.88')}")
          print(f"  '3104,88'  = {text.count('3104,88')}")
          print(f"  '3819'     = {text.count('3819')}")
          print(f"  '3819,00'  = {text.count('3819,00')}")
          print(f"  '3819.00'  = {text.count('3819.00')}")
          EOF
          python diag.py
