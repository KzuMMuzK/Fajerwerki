# Render Blueprint: New + > Blueprint > wybierz to repo. Render zapyta o wartości zmiennych oznaczonych sync: false.
services:
  - type: web
    name: fajerwerki
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY            # losowy ciąg do podpisywania sesji - Render wygeneruje go sam
        generateValue: true
      - key: BASE_URL              # adres strony, np. https://fajerwerki.onrender.com (bez ukośnika na końcu)
        sync: false
      - key: DISCORD_CLIENT_ID     # discord.com/developers/applications > Twoja aplikacja > OAuth2
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: ADMIN_DISCORD_IDS     # Twoje ID użytkownika Discord (kilka po przecinku) - te osoby są zawsze administratorami
        sync: false
      - key: DATA_REPO             # np. twojlogin/fajerwerki-dane (prywatne repo z bazą)
        sync: false
      - key: DATA_TOKEN            # token GitHub fine-grained: tylko to repo, Contents = Read and write
        sync: false
