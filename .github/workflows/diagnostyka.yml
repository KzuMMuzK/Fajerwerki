name: Diagnostyka Bieguna

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj zależności
        run: pip install requests beautifulsoup4 lxml PySocks

      - name: Uruchom diagnostykę Bieguna
        env:
          SCRAPER_PROXIES: ${{ secrets.SCRAPER_PROXIES }}
        run: |
          cat > diag.py << 'EOF'
          import sys, threading
          from collections import Counter
          sys.path.insert(0, '.')
          from bs4 import BeautifulSoup
          import fajerwerki_scraper as scraper

          class Args:
              proxy = None
              proxy_file = None
          scraper.setup_proxies(Args())
          print(f"Proxy w puli: {len(scraper._proxies)}")

          site = scraper.SITES["biegun"]
          host = "fajerwerkibiegun.pl"
          scraper._proxy_hosts.add(host)
          scraper._min_delay[host] = float(site.get("delay", 1.0))
          scraper._host_sem[host] = threading.Semaphore(int(site.get("max_parallel", 2)))

          stats = Counter()
          hdrs = scraper.site_headers("biegun", site)

          # ==========================================
          # TEST 1: Strona produktu i funkcja extract()
          # ==========================================
          url_prod = "https://fajerwerkibiegun.pl/pl/3-wyrzutnie?page=16"
          print("\n" + "=" * 60)
          print("TEST 1: Pobieranie strony produktu (extract)")
          print("=" * 60)
          r_prod = scraper.get(url_prod, stats=stats, headers=hdrs)
          
          if r_prod:
              d = scraper.extract(r_prod.content, site)
              print(f"  extract() zwraca cenę: {d.get('price') if d else 'None'}")
          else:
              print("  Błąd pobierania strony produktu!")

          # ==========================================
          # TEST 2: Strona kategorii i funkcja parse_listing()
          # ==========================================
          url_kat = "https://fajerwerkibiegun.pl/pl/3-wyrzutnie"
          print("\n" + "=" * 60)
          print("TEST 2: Pobieranie strony kategorii (listing)")
          print("=" * 60)
          r_kat = scraper.get(url_kat, stats=stats, headers=hdrs)
          
          if r_kat:
              n_tiles, items = scraper.parse_listing(r_kat.content, url_kat, site["listing"])
              print(f"  Znaleziono {n_tiles} kafelków, sparsowano {len(items)} produktów.")
              
              found = False
              for it in items:
                  if "APOCALYPSE" in it["name"].upper():
                      print(f"  ✅ ZNALEZIONO PRODUKT W LISTINGU:")
                      print(f"     Nazwa: {it['name']}")
                      print(f"     Cena zapisana: {it['price']}")
                      print(f"     URL: {it['url']}")
                      found = True
              if not found:
                  print("  ❌ Nie znaleziono produktu APOCALYPSE na tej stronie kategorii (może jest na innej stronie).")
                  
              # ==========================================
              # TEST 3: Surowy HTML kafelka z kategorii
              # ==========================================
              print("\n" + "=" * 60)
              print("TEST 3: Surowy HTML kafelka produktu z kategorii")
              print("=" * 60)
              soup_kat = BeautifulSoup(r_kat.content, "lxml")
              # Szukamy kafelka (article), który zawiera słowo APOCALYPSE
              for tile in soup_kat.select("article.product-miniature"):
                  if "APOCALYPSE" in tile.get_text().upper():
                      print("Kod HTML kafelka (fragment z ceną):")
                      price_span = tile.select_one(".product-price")
                      if price_span:
                          print(f"  Rodzic ceny: {price_span.parent}")
                          print(f"  Atrybuty ceny: {price_span.attrs}")
                          print(f"  Tekst ceny: {price_span.get_text(strip=True)!r}")
                          print(f"  Cały tag HTML: {price_span}")
                      else:
                          print("  Nie znaleziono .product-price w kafelku.")
                      break
          else:
              print("  Błąd pobierania strony kategorii!")
          EOF
          python diag.py
