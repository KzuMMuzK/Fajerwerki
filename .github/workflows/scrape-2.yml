name: scrape-fajerwerki

# Repo z kodem jest PUBLICZNE (nielimitowane minuty Actions), a dane (baza, CSV)
# trafiają do osobnego PRYWATNEGO repo - patrz sekrety DATA_REPO i DATA_REPO_TOKEN.

on:
  schedule:
    - cron: "0 5 * * *"   # codziennie 05:00 UTC (06:00/07:00 w Polsce)
  workflow_dispatch:        # przycisk "Run workflow" z polami poniżej
    inputs:
      only:
        description: "Sklepy po przecinku (puste = wszystkie), np. odpalaj,pirohit"
        required: false
        default: ""
      max:
        description: "Limit do testów: stron na kategorię (listing) / adresów na sklep (sitemap). Puste = bez limitu"
        required: false
        default: ""
      workers:
        description: "Liczba wątków (puste = 12)"
        required: false
        default: ""
      delay:
        description: "Min. odstęp między zapytaniami do jednego sklepu w sekundach (puste = 0.5)"
        required: false
        default: ""
      mode:
        description: "Tryb: smart (domyślnie: sitemapa, a gdy się nie da - kategorie), sitemap (tylko sitemapy), listing (tylko kategorie) albo auto"
        required: false
        default: ""
      free_proxy:
        description: "Darmowe proxy z Geonode (tylko dla sklepów z use_proxy: Pirohit, Szopik); sprawdzane przed użyciem"
        type: boolean
        default: false
      browser_ua:
        description: "User-Agent przeglądarki: puste = ustawienie ze zmiennej SCRAPER_BROWSER_UA, 1 = wszystkie sklepy, albo lista po przecinku (np. lider,szopik)"
        required: false
        default: ""
      verbose:
        description: "Szczegółowe logi (każdy produkt)"
        type: boolean
        default: false
      recheck:
        description: "Sprawdź ponownie adresy znane jako nie-produkty (tryb sitemap)"
        type: boolean
        default: false
      refresh_config:
        description: "Wymuś ponowne wykrycie platform/selektorów/kategorii (ignoruj cache)"
        type: boolean
        default: false

permissions:
  contents: write           # tylko do podtrzymania aktywności tego repo (patrz ostatni krok)

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
      SCRAPER_DB: data/fajerwerki.db
      SCRAPER_AUTOCONFIG_CACHE: data/autoconfig_cache.json   # NOWE
    steps:
      # Bezpiecznik: bez prywatnego repo na dane baza wylądowałaby w publicznym.
      - name: Sprawdź konfigurację prywatnych danych
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO" ] || [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::error title=Brak sekretów DATA_REPO / DATA_REPO_TOKEN::Dane mają trafiać do prywatnego repo, nie do publicznego. Dodaj oba sekrety w Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v4            # kod (to publiczne repo)

      - uses: actions/checkout@v4            # dane (prywatne repo) -> folder data/
        with:
          repository: ${{ secrets.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "requests[socks]" beautifulsoup4 lxml

      - name: Scrape
        env:
          # Ustawienia idą przez zmienne środowiskowe - nie trzeba żadnych flag "--".
          # Przy uruchomieniu z harmonogramu pola są puste = wartości domyślne ze skryptu.
          SCRAPER_ONLY: ${{ inputs.only }}
          SCRAPER_MODE: ${{ inputs.mode || vars.SCRAPER_MODE }}
          SCRAPER_PROXY_SOURCE: ${{ inputs.free_proxy && 'geonode' || vars.SCRAPER_PROXY_SOURCE }}
          SCRAPER_PROXY_COUNTRY: ${{ vars.SCRAPER_PROXY_COUNTRY }}
          SCRAPER_MAX: ${{ inputs.max }}
          SCRAPER_WORKERS: ${{ inputs.workers }}
          SCRAPER_DELAY: ${{ inputs.delay }}
          # Sklepy, które blokują bota (403), mogą wymagać UA przeglądarki. Stałe ustawienie: Settings >
          # Secrets and variables > Actions > Variables (albo Secrets) > SCRAPER_BROWSER_UA (np. lider,szopik)
          SCRAPER_BROWSER_UA: ${{ inputs.browser_ua || vars.SCRAPER_BROWSER_UA || secrets.SCRAPER_BROWSER_UA }}
          SCRAPER_VERBOSE: ${{ inputs.verbose && '1' || '' }}
          SCRAPER_RECHECK: ${{ inputs.recheck && '1' || '' }}
          # Sekrety (Settings > Secrets and variables > Actions):
          SCRAPER_PROXIES: ${{ secrets.SCRAPER_PROXIES }}   # http://user:haslo@ip:port,http://user:haslo@ip2:port
          SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}   # Twój e-mail dla sklepów (User-Agent)
          SCRAPER_REFRESH_CONFIG: ${{ inputs.refresh_config && '1' || '' }}
        run: python -u fajerwerki_scraper.py

      - name: Export CSV
        run: python fajerwerki_scraper.py export data/latest.csv
      
      - name: Zapisz dane w prywatnym repo
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fajerwerki.db latest.csv
          [ -f autoconfig_cache.json ] && git add autoconfig_cache.json || true
          git diff --cached --quiet || git commit -m "Aktualizacja cen $(date -u +%F)"
          git push

      # GitHub wyłącza harmonogram w PUBLICZNYM repo po 60 dniach bez commitów.
      # Dane idą do innego repo, więc co ~30 dni dajemy tu drobny commit.
      - name: Podtrzymaj aktywność publicznego repo
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 30 ]; then
            date -u +%F > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "keepalive $(date -u +%F)"
            git push
          fi
