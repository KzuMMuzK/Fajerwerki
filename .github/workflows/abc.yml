name: Check price variants (PL proxy decisive test)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL'
        required: false
        default: 'https://fajerwerkibiegun.pl/pl/3-wyrzutnie?page=16'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install 'requests[socks]' beautifulsoup4 lxml

      - name: Run
        shell: python
        env:
          PYTHONUNBUFFERED: '1'
          TARGET_URL: ${{ inputs.url }}
        run: |
          import os, sys, re, time
          from concurrent.futures import ThreadPoolExecutor, as_completed, TimeoutError as FT
          try:
              import socks  # noqa
          except ImportError:
              print("brak PySocks", flush=True); sys.exit(1)
          import requests
          from bs4 import BeautifulSoup

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")
          URL = os.environ.get("TARGET_URL", "https://fajerwerkibiegun.pl/pl/3-wyrzutnie?page=16")
          GEONODE = "https://proxylist.geonode.com/api/proxy-list"
          PX_JSON = ("https://cdn.jsdelivr.net/gh/proxifly/free-proxy-list@main/"
                     "proxies/protocols/socks5/data.json")

          def log(m): print(m, flush=True)

          def fetch_pl_geonode():
              out = []
              for page in (1, 2, 3):
                  try:
                      r = requests.get(GEONODE, params={
                          "limit": 100, "page": page, "country": "PL",
                          "sort_by": "lastChecked", "sort_type": "desc",
                      }, timeout=30, headers={"User-Agent": UA})
                      data = r.json().get("data", [])
                  except Exception as e:
                      log(f"[geonode PL] page {page}: {e.__class__.__name__}")
                      continue
                  for it in data:
                      try: ip, port = it["ip"], it["port"]
                      except (KeyError, TypeError): continue
                      if str(it.get("anonymityLevel","")).lower() == "transparent": continue
                      if float(it.get("upTime") or 0) < 80: continue
                      protos = {str(x).lower() for x in (it.get("protocols") or [])}
                      if "socks5" not in protos: continue
                      out.append({"proxy": f"socks5h://{ip}:{port}", "country": "PL"})
              log(f"[geonode] {len(out)} PL socks5")
              return out

          def fetch_pl_proxifly():
              try:
                  r = requests.get(PX_JSON, timeout=30, headers={"User-Agent": UA})
                  data = r.json()
              except Exception as e:
                  log(f"[proxifly] {e.__class__.__name__}")
                  return []
              out = []
              for item in data:
                  px = item.get("proxy")
                  if not px or not px.startswith("socks5://"): continue
                  c = (item.get("geolocation") or {}).get("country","").upper()
                  if c != "PL": continue
                  out.append({"proxy": px, "country": "PL"})
              log(f"[proxifly] {len(out)} PL socks5")
              return out

          def first_price(html_bytes):
              text = html_bytes.decode("utf-8-sig", "replace")
              if text.lstrip().startswith("{"):
                  try:
                      import json as j
                      p = j.loads(text)
                      if isinstance(p, dict) and isinstance(p.get("rendered_products"), str):
                          text = p["rendered_products"]
                  except Exception: pass
              soup = BeautifulSoup(text, "lxml")
              for a in soup.select("article.product-miniature")[:5]:
                  n = a.select_one("h3.product-title a")
                  pr = a.select_one("span.product-price")
                  if n and pr:
                      return n.get_text(strip=True)[:40], pr.get_text(" ", strip=True), pr.get("content")
              return None, None, None

          def test_variant(proxy, url_suffix, method="GET", post_data=None):
              """Zwraca dict z wynikiem testu wariantu."""
              session = requests.Session()
              session.headers.update({"User-Agent": UA, "Accept-Language": "pl-PL,pl;q=0.9"})
              url = URL + url_suffix
              try:
                  if method == "POST":
                      r = session.post(url, data=post_data or {}, timeout=25,
                                       proxies={"http": proxy, "https": proxy},
                                       allow_redirects=True)
                  else:
                      r = session.get(url, timeout=25,
                                      proxies={"http": proxy, "https": proxy})
                  if r.status_code != 200:
                      return {"status": f"HTTP {r.status_code}"}
                  name, price, content = first_price(r.content)
                  cookies = {k: v for k, v in session.cookies.items()
                             if "presta" in k.lower() or "curr" in k.lower()}
                  return {"status": "ok", "name": name, "price": price,
                          "content": content, "cookies": cookies,
                          "final_url": r.url}
              except requests.RequestException as e:
                  return {"status": e.__class__.__name__}
              finally:
                  session.close()

          def main():
              candidates = fetch_pl_geonode() + fetch_pl_proxifly()
              if not candidates:
                  log("ERROR: 0 proxy z PL. Nie da się rozstrzygnąć.")
                  return
              log(f"\n[validate] {len(candidates)} PL proxy, szukam 3 działających...")
              working = []
              with ThreadPoolExecutor(max_workers=30) as ex:
                  futs = {ex.submit(lambda e: test_variant(e["proxy"], ""), e): e
                          for e in candidates[:120]}
                  try:
                      for f in as_completed(futs, timeout=90):
                          if len(working) >= 3: break
                          try: res = f.result(timeout=1)
                          except Exception: continue
                          if res.get("status") == "ok" and res.get("price"):
                              working.append(futs[f])
                              log(f"  [OK] {futs[f]['proxy']} -> {res['price']!r}")
                  except FT:
                      pass
              if not working:
                  log("ERROR: 0 działających PL proxy w 90s")
                  return
              log(f"[validate] {len(working)} działających PL proxy\n")

              VARIANTS = [
                  ("baseline (bez zmian)", ""),
                  ("?id_currency=1", "?id_currency=1" if "?" not in URL else "&id_currency=1"),
                  ("?id_country=14&id_currency=1",
                   "?id_country=14&id_currency=1" if "?" not in URL
                   else "&id_country=14&id_currency=1"),
                  ("?id_country=114&id_currency=1",
                   "?id_country=114&id_currency=1" if "?" not in URL
                   else "&id_country=114&id_currency=1"),
              ]

              results = {}
              for label, suffix in VARIANTS:
                  log(f"=== {label} ===")
                  rows = []
                  for entry in working:
                      res = test_variant(entry["proxy"], suffix)
                      if res.get("status") != "ok":
                          log(f"  [{entry['proxy'][:30]}] -> {res['status']}")
                          continue
                      rows.append(res)
                      log(f"  [{entry['proxy'][:30]}] -> {res['price']!r}")
                  results[label] = rows
                  log("")

              # POST SubmitCurrency — test tylko jeśli GET nie zadziałał
              log("=== POST SubmitCurrency=1&id_currency=1 ===")
              post_rows = []
              for entry in working:
                  res = test_variant(entry["proxy"], "",
                                     method="POST",
                                     post_data={"SubmitCurrency": "1", "id_currency": "1"})
                  if res.get("status") != "ok":
                      log(f"  [{entry['proxy'][:30]}] -> {res['status']}")
                      continue
                  post_rows.append(res)
                  log(f"  [{entry['proxy'][:30]}] -> {res['price']!r} "
                      f"(final_url={res.get('final_url', '?')[:60]})")
              results["POST SubmitCurrency=1"] = post_rows
              log("")

              # === VERDICT ===
              log("=" * 100)
              log("VERDICT")
              log("")
              for label, rows in results.items():
                  if not rows:
                      log(f"  {label:<35} BRAK DANYCH")
                      continue
                  prices = [r["price"] for r in rows]
                  # wyciągnij symbol waluty
                  syms = set()
                  for p in prices:
                      if "€" in p: syms.add("EUR")
                      elif "zł" in p.lower() or "pln" in p.lower(): syms.add("PLN")
                  verdict = "PLN ✅" if syms == {"PLN"} else ("EUR ❌" if syms == {"EUR"} else f"MIESZANE {syms}")
                  log(f"  {label:<35} {len(rows)} próbek | {verdict} | np. {prices[0]!r}")

              log("")
              log("Interpretacja:")
              log("  Jeśli 'baseline (bez zmian)' przez PL proxy daje PLN →")
              log("    FIX: w SITES['biegun'] dodaj \"proxy_country\": \"PL\"")
              log("    i w proxy_for() filtruj pulę do PL (lub tylko PL proxy w SCRAPER_PROXIES).")
              log("")
              log("  Jeśli 'POST SubmitCurrency=1' daje PLN →")
              log("    FIX: w scraperze raz na start wysyłaj POST z tymi parametrami,")
              log("    potem GET-y już dostają PLN przez cookie.")
              log("")
              log("  Jeśli WSZYSTKO daje EUR →")
              log("    Bieg jest w trybie 'geolokalizacja z IP, ignoruj walutę'.")
              log("    Zostają tylko prawdziwe PL proxy (rezerwowe) albo zmiana sklepu docelowego.")

          main()
